name: MILYWAY 점심 메뉴 수집

on:
  schedule:
    # 시간은 UTC 기준 (시카고 = UTC-6 겨울 / UTC-5 여름). 식당이 새 주 메뉴를 올리는 때가 토요일 저녁 ~ 월요일 오전으로 들쭉날쭉하고,
    # GitHub 의 예약 실행은 몇 시간씩 늦어질 수 있어서 주말 ~ 월요일에는 자주 확인합니다. 메뉴가 그대로면 아무것도 바꾸지 않습니다.
    - cron: '17 22 * * 6'                      # 토 16:17 CT
    - cron: '17 4,18,22 * * 0'                 # 토 22:17 · 일 12:17 · 일 16:17 CT
    - cron: '17 2,6,11,13,15,17,19,21 * * 1'   # 일 20:17 · 월 00:17 · 월 05:17 ~ 15:17 CT (2시간마다)
    - cron: '17 11,15 * * 2-5'                 # 화 ~ 금 하루 2번 (05:17 · 09:17 CT)
  workflow_dispatch: {}          # Actions 탭에서 "Run workflow"로 수동 실행

permissions:
  contents: write

concurrency:
  group: milyway-menu
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 메뉴 PDF 받기
        run: node scripts/fetch-menu.mjs

      - name: 변경 시 커밋
        id: commit
        run: |
          if git diff --quiet -- menu-data.json && git ls-files --error-unmatch menu-data.json >/dev/null 2>&1; then
            echo "변경 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name  "milyway-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add menu-data.json
            git commit -m "menu: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: jsDelivr 캐시 갱신
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/menu-data.json" || echo "purge 요청 실패(무시) — 최대 12시간 후 자동 반영"
